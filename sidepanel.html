<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>AI Voice Summarizer</title>
  <style>
    :root {
      --primary: #8e75ff;
      --primary-dark: #6e56cf;
      --bg: #f8f9fc;
      --card-bg: #ffffff;
      --text: #1a1b1e;
      --text-secondary: #6b7280;
      --border: #e5e7eb;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      padding: 16px;
      gap: 16px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 8px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .gemini-logo {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #4285f4, #9b72cb, #d96570);
      border-radius: 50%;
      flex-shrink: 0;
    }

    h1 {
      font-size: 1.1rem;
      font-weight: 600;
      color: #374151;
    }

    .icon-btn {
      background: none;
      border: none;
      padding: 8px;
      border-radius: 50%;
      cursor: pointer;
      color: var(--text-secondary);
      transition: background-color 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-btn:hover {
      background-color: #f3f4f6;
    }

    /* Views */
    main {
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex-grow: 1;
      overflow: hidden;
    }

    /* Configuration Section */
    .config-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .config-header {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }

    .input-group {
      display: flex;
      gap: 8px;
    }

    input {
      flex-grow: 1;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--primary);
    }

    button {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    #saveApiKey {
      background-color: var(--primary);
      color: white;
    }

    #saveApiKey:hover {
      background-color: var(--primary-dark);
    }

    /* Actions Section */
    .actions {
      display: flex;
      gap: 8px;
    }

    #summarizeBtn {
      flex-grow: 1;
      background: linear-gradient(135deg, #8e75ff, #6e56cf);
      color: white;
      box-shadow: 0 4px 10px rgba(110, 86, 207, 0.3);
    }

    #summarizeBtn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 6px 14px rgba(110, 86, 207, 0.4);
    }

    #summarizeBtn:active:not(:disabled) {
      transform: translateY(0);
    }

    #summarizeBtn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      background: #9ca3af;
      box-shadow: none;
    }

    #stopBtn {
      background-color: #fee2e2;
      color: #dc2626;
    }

    #stopBtn:hover:not(:disabled) {
      background-color: #fecaca;
    }

    #stopBtn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Status Section */
    .status-area {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px;
    }

    #status {
      font-size: 0.85rem;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pulse {
      width: 8px;
      height: 8px;
      background-color: #10b981;
      border-radius: 50%;
      display: none;
    }

    .active .pulse {
      display: block;
      animation: pulse-animation 2s infinite;
    }

    @keyframes pulse-animation {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    /* Output Area */
    .output-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .output-header {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-secondary);
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
    }

    #summary {
      flex-grow: 1;
      overflow-y: auto;
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--text);
      white-space: pre-wrap;
    }

    #summary::-webkit-scrollbar {
      width: 6px;
    }

    #summary::-webkit-scrollbar-thumb {
      background-color: #e5e7eb;
      border-radius: 10px;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #9ca3af;
      text-align: center;
      padding: 20px;
    }

    .back-btn {
      display: flex;
      align-items: center;
      gap: 4px;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.9rem;
      margin-bottom: 8px;
      cursor: pointer;
    }

    .back-btn:hover {
      color: var(--text);
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <div class="gemini-logo"></div>
      <h1>AI Voice Summarizer</h1>
    </div>
    <button id="toSettings" class="icon-btn" title="Settings">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
    </button>
  </header>
  
  <main id="mainView">
    <div class="actions">
      <button id="summarizeBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
        Summarize Page
      </button>
      <button id="stopBtn" disabled title="Stop playback">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect></svg>
      </button>
    </div>

    <div class="status-area">
      <div id="status">
        <div class="pulse"></div>
        Ready
      </div>
    </div>
    
    <div class="output-card">
      <div class="output-header">
        <span>Summary Transcription</span>
      </div>
      <div id="summary">
        <div class="empty-state">
          <p>No summary generated yet.</p>
          <p style="font-size: 0.8rem; margin-top: 8px;">Click "Summarize Page" to start.</p>
        </div>
      </div>
    </div>
  </main>

  <main id="settingsView" style="display: none;">
    <div id="toMain" class="back-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      Back
    </div>

    <div class="config-card">
      <div class="config-header">Gemini API Configuration</div>
      <p style="font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 8px;">
        Your API key is stored locally on your device.
      </p>
      <div class="input-group">
        <input type="password" id="apiKey" placeholder="Enter API Key">
        <button id="saveApiKey">Save</button>
      </div>
    </div>
  </main>

  <script type="module" src="sidepanel.dist.js"></script>
</body>
</html>
